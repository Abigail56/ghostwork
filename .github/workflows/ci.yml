name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ghostwork
          POSTGRES_PASSWORD: ghostwork
          POSTGRES_DB: ghostwork_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostwork" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+psycopg://ghostwork:ghostwork@localhost:5432/ghostwork_test
      DATABASE_URL: postgresql+psycopg://ghostwork:ghostwork@localhost:5432/ghostwork_test
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
      INTEGRATION_ENCRYPTION_KEY: kQhQ3dGcJYx5nHq3qQ2kD8yq8VYwU7b1b9h7cXz0M1s=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations match models
        run: python -m alembic upgrade head && python -m alembic check
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  shared-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web and mobile Terms are identical
        run: scripts/sync-shared.sh --check

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
