services:
  db:
    image: postgres:17-alpine
    container_name: ghostwork-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ghostwork}
      POSTGRES_USER: ${POSTGRES_USER:-ghostwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ghostwork_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ghostwork-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - ghostwork_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ghostwork_postgres_data:
  ghostwork_redis_data: